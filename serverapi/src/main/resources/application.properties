server.port=8092
spring.jpa.generate-ddl=true
# RISK-17 fix: validate umesto update sprecava tihe promene seme u produkciji.
# Za izmene seme koristiti Flyway/Liquibase migracije.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/raflms?serverTimezone=Europe/Belgrade
# RISK-05 fix: lozinka se ucitava iz env varijable RAF_DB_PASSWORD.
# Na serveru pokrenuti: export RAF_DB_PASSWORD=<lozinka>
spring.datasource.username=bojana
spring.datasource.password=${RAF_DB_PASSWORD}
spring.jackson.time-zone=Europe/Belgrade
logging.file.path=/home/user/raflms/logs
# RAFLMS custom fields
raflms.gitrootdir=/home/user/raflms/RAFProjects/gitrepos/remote
#local
#raflms.projectrootdir=/home/bojana/raflms/remote/projectfolder
#remote
raflms.projectrootdir=/home/user/raflms/projectsrootdir
# RISK-04 fix: auth token se ucitava iz env varijable RAF_AUTH_TOKEN.
# Na serveru pokrenuti: export RAF_AUTH_TOKEN=<token>
raflms.auth.token=${RAF_AUTH_TOKEN}
# RISK-09 fix: limit velicine upload-a - student fajlovi su mali ZIP/JAR arhive.
# 50MB je vise nego dovoljno; bez ovog limita napadac moze da posalje GB fajl i sruSi server.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
# RISK-16 fix: CORS - dozvoljeni origin za teacher dashboard.
# Na serveru: export RAF_ALLOWED_ORIGIN=http://<ip-teacher-dashboarda>
raflms.cors.allowed-origin=${RAF_ALLOWED_ORIGIN}
# RISK-12: HTTPS konfiguracija (zahteva SSL sertifikat na serveru).
# Kada sertifikat bude dostupan, otkomentarisati sledece linije i postaviti putanju do keystore-a:
# server.ssl.key-store=${RAF_SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${RAF_SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=raflms
# Nginx reverse proxy treba da terminira SSL i prosledi HTTP na 8092 uz X-Forwarded-Proto: https