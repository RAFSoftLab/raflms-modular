server.port=8093
spring.jpa.generate-ddl=true
# RISK-17 fix: validate umesto update sprecava tihe promene seme u produkciji.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://localhost:3306/raflmstracking?serverTimezone=UTC
spring.datasource.username=bojana
# RISK-05 fix: lozinka se ucitava iz env varijable RAF_DB_PASSWORD.
spring.datasource.password=${RAF_DB_PASSWORD}
logging.file.path=/home/user/raflmstrackig/logs
# RISK-06 fix: token za zastitu GET endpoint-a (isti token kao serverapi).
# Na serveru: export RAF_AUTH_TOKEN=<token>
raflms.auth.token=${RAF_AUTH_TOKEN}
# RISK-16 fix: CORS — dozvoljeni origin za teacher dashboard.
# Na serveru: export RAF_ALLOWED_ORIGIN=http://<ip-teacher-dashboarda>
raflms.cors.allowed-origin=${RAF_ALLOWED_ORIGIN}
# RISK-14 fix (GDPR): broj dana koliko se cuvaju tracking podaci (default 730 = 2 godine).
# Na serveru: export RAF_RETENTION_DAYS=730
raflms.retention.days=${RAF_RETENTION_DAYS:730}
